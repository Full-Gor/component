    function createRamSlot(d,h){const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.BoxGeometry(d.w,0.85,d.h),new THREE.MeshStandardMaterial({color:d.color,roughness:0.4})));const lg=new THREE.BoxGeometry(d.w*1.4,0.35,0.7),lm=new THREE.MeshStandardMaterial({color:COLORS.ramLatch});const l1=new THREE.Mesh(lg,lm);l1.position.set(0,0.25,-d.h/2+0.25);g.add(l1);const l2=new THREE.Mesh(lg,lm);l2.position.set(0,0.25,d.h/2-0.25);g.add(l2);return g;}

    function createHeatsink(d,h){const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.BoxGeometry(d.w,0.45,d.h),new THREE.MeshStandardMaterial({color:d.color,roughness:0.3,metalness:0.4})));const fg=new THREE.BoxGeometry(d.w*0.88,2,0.12),fm=new THREE.MeshStandardMaterial({color:d.color,roughness:0.25,metalness:0.45});for(let i=0;i<14;i++){const f=new THREE.Mesh(fg,fm);f.position.set(0,1.2,-d.h/2+0.25+i*(d.h/14));g.add(f);}return g;}
    function createPCISlot(d,h){const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.BoxGeometry(d.w,0.95,d.h),new THREE.MeshStandardMaterial({color:d.color,roughness:0.4})));const inner=new THREE.Mesh(new THREE.BoxGeometry(d.w*0.55,0.55,d.h*0.88),new THREE.MeshStandardMaterial({color:COLORS.socketPins,metalness:0.55}));inner.position.y=-0.15;g.add(inner);return g;}
    function createSata(d,h){const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.BoxGeometry(d.w,0.65,d.h),new THREE.MeshStandardMaterial({color:d.color,roughness:0.35})));const inner=new THREE.Mesh(new THREE.BoxGeometry(d.w*0.65,0.28,d.h*0.75),new THREE.MeshStandardMaterial({color:0x1a1a1a}));inner.position.y=0.08;g.add(inner);return g;}
    function createATX24(d,h){const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.BoxGeometry(d.w,1,d.h),new THREE.MeshStandardMaterial({color:d.color,roughness:0.3})));return g;}
    function createATX8(d,h){const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.BoxGeometry(d.w,0.8,d.h),new THREE.MeshStandardMaterial({color:d.color,roughness:0.3})));return g;}
    function createBattery(d,h){const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.CylinderGeometry(d.w/2,d.w/2,0.3,24),new THREE.MeshStandardMaterial({color:d.color,metalness:0.65})));const top=new THREE.Mesh(new THREE.CylinderGeometry(d.w/2*0.65,d.w/2*0.65,0.02,24),new THREE.MeshStandardMaterial({color:0xd4af37,metalness:0.75}));top.position.y=0.16;g.add(top);return g;}
    function createGeneric(d,h){return new THREE.Mesh(new THREE.BoxGeometry(d.w,h,d.h),new THREE.MeshStandardMaterial({color:d.color,roughness:0.5}));}
    function createFootprints(){COMPONENTS.forEach(d=>{const fp=createFootprint(d);footprintMeshes.push(fp);mainGroup.add(fp);fpByComp.set(d.id,fp);});}
    function createFootprint(d){const g=new THREE.Group();const s=Math.max(d.w,d.h)*0.35;const r=new THREE.Mesh(new THREE.RingGeometry(s*0.55,s,24),new THREE.MeshBasicMaterial({color:0xe94560,transparent:true,opacity:0.55,side:THREE.DoubleSide}));r.rotation.x=-Math.PI/2;g.add(r);g.add(new THREE.Mesh(new THREE.SphereGeometry(0.08,10,10),new THREE.MeshBasicMaterial({color:0xe94560})));g.position.set(d.x,BOARD.t/2+0.015,d.z);g.userData={id:d.id,compId:d.id,occupied:true};g.visible=false;return g;}
    function checkCompat(c,p){if(!c?.userData)return{status:'floating',fp:null};let n=null,m=Infinity;footprintMeshes.forEach(f=>{const d=p.distanceTo(f.position);if(d<m){m=d;n=f;}});if(!n||m>3.5)return{status:'floating',fp:null};if(n.userData.compId===c.userData.id)return{status:'compatible',fp:n};return{status:'incompatible',fp:n};}
    function updateCompatVisuals(s,c,f){compatStatus.className='compat-status visible '+s;compatStatus.textContent=s==='compatible'?'✓ COMPATIBLE':s==='incompatible'?'✗ INCOMPATIBLE':'○ FLOTTANT';c.traverse(ch=>{if(ch.material?.emissive){ch.material.emissive.setHex(s==='compatible'?COLORS.ok:s==='incompatible'?COLORS.bad:COLORS.float);ch.material.emissiveIntensity=0.25;}});if(f){f.visible=true;f.children.forEach(ch=>{if(ch.material)ch.material.color.setHex(s==='compatible'?COLORS.ok:COLORS.bad);});}}
    function clearCompatVisuals(){compatStatus.classList.remove('visible');componentMeshes.forEach(c=>c.traverse(ch=>{if(ch.material?.emissive)ch.material.emissiveIntensity=0;}));footprintMeshes.forEach(f=>{f.visible=deployProgress>0.3;f.children.forEach(ch=>{if(ch.material)ch.material.color.setHex(0xe94560);});});}
    function snapToFP(c,f){if(!c||!f||isSnapping)return;isSnapping=true;const sP=c.position.clone(),tP=new THREE.Vector3(f.position.x,c.userData.origPos.y,f.position.z),lH=sP.y+6,dur=650,sT=performance.now(),b=c.userData.bounds||new THREE.Vector3(2,2,2),bolts=createBolts(c,f,b);function anim(t){const e=t-sT;let p=Math.min(e/dur,1),ep;if(p<0.45)ep=0.22*(1-Math.pow(1-p/0.45,2));else ep=0.22+0.78*Math.pow((p-0.45)/0.55,2.5);const cur=new THREE.Vector3();cur.x=sP.x+(tP.x-sP.x)*ep;cur.z=sP.z+(tP.z-sP.z)*ep;if(p<0.22)cur.y=sP.y+(lH-sP.y)*(1-Math.pow(1-p/0.22,2));else{const dp=(p-0.22)/0.78,de=dp<0.55?0.12*Math.pow(dp/0.55,0.5):0.12+0.88*Math.pow((dp-0.55)/0.45,3);cur.y=lH+(tP.y-lH)*de;}c.position.copy(cur);updateBolts(bolts,c,f,p,b);if(p<1)requestAnimationFrame(anim);else{c.position.copy(tP);createFlash(c,f,b);removeBolts(bolts);c.traverse(ch=>{if(ch.material?.emissive)ch.material.emissiveIntensity=0;});c.userData.isConnected=true;f.userData.occupied=true;updateStats();isSnapping=false;}}requestAnimationFrame(anim);}
    function createBolts(c,f,b){const bolts=[],mR=Math.min(b.x,b.z)*0.4;for(let i=0;i<4;i++){const pts=Array(9).fill().map(()=>new THREE.Vector3()),geo=new THREE.BufferGeometry().setFromPoints(pts),mat=new THREE.LineBasicMaterial({color:0xe94560,transparent:true,opacity:0.85}),bolt=new THREE.Line(geo,mat);bolt.userData.angle=(i/4)*Math.PI*2;bolt.userData.maxR=mR;mainGroup.add(bolt);bolts.push(bolt);}return bolts;}
    function updateBolts(bolts,c,f,prog,b){const cP=c.position,tP=f.position,op=prog>0.22?Math.min((prog-0.22)/0.08,1)*(1-Math.max(0,(prog-0.88)/0.12)):0,mR=Math.min(b.x,b.z)*0.35;bolts.forEach((bolt,i)=>{const pos=bolt.geometry.attributes.position,t=performance.now(),ang=bolt.userData.angle+t*0.005,r=mR*(0.55+Math.sin(t*0.008+i)*0.35);const sX=cP.x+Math.cos(ang)*r,sZ=cP.z+Math.sin(ang)*r,sY=cP.y-b.y/2,eR=r*0.45,eX=tP.x+Math.cos(ang+Math.PI)*eR,eZ=tP.z+Math.sin(ang+Math.PI)*eR,eY=tP.y+0.15,n=9;for(let j=0;j<n;j++){const fr=j/(n-1);let x=sX+(eX-sX)*fr,y=sY+(eY-sY)*fr,z=sZ+(eZ-sZ)*fr;if(j>0&&j<n-1){const jit=mR*0.25*(1-fr);x+=(Math.random()-0.5)*jit;z+=(Math.random()-0.5)*jit;y+=(Math.random()-0.5)*jit*0.15;}pos.setXYZ(j,x,y,z);}pos.needsUpdate=true;bolt.material.opacity=op*(0.55+Math.random()*0.4);bolt.visible=op>0.08;bolt.material.color.setHSL(0.95+Math.sin(t*0.012+i*0.6)*0.05,0.85,0.55);});}
    function removeBolts(bolts){bolts.forEach(b=>{mainGroup.remove(b);b.geometry.dispose();b.material.dispose();});}
    function createFlash(c,f,b){const mS=Math.min(b.x,b.z)*0.45,r1=new THREE.Mesh(new THREE.RingGeometry(0.04,mS*0.35,24),new THREE.MeshBasicMaterial({color:0xe94560,transparent:true,opacity:0.85,side:THREE.DoubleSide}));r1.position.copy(f.position);r1.position.y+=0.04;r1.rotation.x=-Math.PI/2;mainGroup.add(r1);const st=performance.now();function anim(t){const p=(t-st)/350;if(p<1){r1.scale.set(1+p*5,1+p*5,1);r1.material.opacity=(1-p)*0.75;requestAnimationFrame(anim);}else{mainGroup.remove(r1);r1.geometry.dispose();r1.material.dispose();}}requestAnimationFrame(anim);}
    function setupControls(){document.getElementById('btnReset').addEventListener('click',resetAll);document.getElementById('btnWire').addEventListener('click',()=>{window.location.href='gigabyte-x58a-wireframe.html';});renderer.domElement.addEventListener('mousedown',onDown);renderer.domElement.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp);renderer.domElement.addEventListener('wheel',onWheel,{passive:false});scrollV.addEventListener('mouseenter',()=>{scrollLocked=true;if(hideTimer)clearTimeout(hideTimer);});scrollV.addEventListener('mouseleave',()=>{if(!isScrollDrag)scrollLocked=false;});scrollH.addEventListener('mouseenter',()=>{scrollLocked=true;if(hideTimer)clearTimeout(hideTimer);});scrollH.addEventListener('mouseleave',()=>{if(!isScrollDrag)scrollLocked=false;});scrollV.addEventListener('mousedown',e=>{e.stopPropagation();isScrollDrag=true;scrollLocked=true;activeScroll='v';scrollStartY=e.clientY;});scrollH.addEventListener('mousedown',e=>{e.stopPropagation();isScrollDrag=true;scrollLocked=true;activeScroll='h';scrollStartX=e.clientX;});window.addEventListener('mousemove',onScrollDrag);document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'){spherical={theta:0.5,phi:Math.PI/3.2,radius:55};updateCamera();}if(e.key.toLowerCase()==='t'){spherical.phi=0.1;spherical.radius=65;updateCamera();}});}
    function onDown(e){if(e.button!==0)return;mouse.x=(e.clientX/window.innerWidth)*2-1;mouse.y=-(e.clientY/window.innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(componentMeshes,true);if(hits.length>0){let c=hits[0].object;while(c.parent&&!componentMeshes.includes(c))c=c.parent;if(componentMeshes.includes(c)){isDragging=true;draggedComp=c;document.body.classList.add('dragging');const fp=fpByComp.get(c.userData.id);if(fp){fp.userData.occupied=false;fp.visible=true;}c.userData.isConnected=false;dragPlane=new THREE.Plane(new THREE.Vector3(0,1,0),-c.position.y);const inter=new THREE.Vector3();raycaster.ray.intersectPlane(dragPlane,inter);dragOffset.copy(c.position).sub(inter);hideScrollbars(true);}}else{isRotating=true;lastX=e.clientX;lastY=e.clientY;}}
    function onMove(e){mouse.x=(e.clientX/window.innerWidth)*2-1;mouse.y=-(e.clientY/window.innerHeight)*2+1;if(isDragging&&draggedComp){raycaster.setFromCamera(mouse,camera);const inter=new THREE.Vector3();if(raycaster.ray.intersectPlane(dragPlane,inter)){draggedComp.position.copy(inter.add(dragOffset));const res=checkCompat(draggedComp,draggedComp.position);currentCompat=res.status;nearestFP=res.fp;updateCompatVisuals(res.status,draggedComp,res.fp);}}else if(isRotating){const dx=e.clientX-lastX,dy=e.clientY-lastY;spherical.theta-=dx*0.007;spherical.phi=Math.max(0.1,Math.min(Math.PI-0.1,spherical.phi-dy*0.007));updateCamera();lastX=e.clientX;lastY=e.clientY;}else if(!isScrollDrag){raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(componentMeshes,true);if(hits.length>0){let c=hits[0].object;while(c.parent&&!componentMeshes.includes(c))c=c.parent;if(componentMeshes.includes(c)&&c.userData.id){if(hoveredComp!==c){hoveredComp=c;showScrollbars(c);}else updateScrollPos(c);hoverTip.textContent=c.userData.name||c.userData.id;hoverTip.style.left=(e.clientX+12)+'px';hoverTip.style.top=(e.clientY-8)+'px';hoverTip.classList.add('visible');}else{hideScrollbars();hoverTip.classList.remove('visible');}}else{hideScrollbars();hoverTip.classList.remove('visible');}}}
    function onUp(e){if(isDragging&&draggedComp){if(currentCompat==='compatible'&&nearestFP)snapToFP(draggedComp,nearestFP);clearCompatVisuals();isDragging=false;draggedComp=null;currentCompat=null;nearestFP=null;document.body.classList.remove('dragging');updateStats();}isRotating=false;if(isScrollDrag){isScrollDrag=false;scrollLocked=false;}}
    function onWheel(e){e.preventDefault();if(hoveredComp){const delta=e.deltaY*0.001,state=compStates.get(hoveredComp.userData.id);if(state){state.cScale=Math.max(0.5,Math.min(3,(state.cScale||1)+delta));hoveredComp.scale.setScalar(state.cScale);updateScrollPos(hoveredComp);}}else{const delta=e.deltaY*0.001;deployProgress=Math.max(0,Math.min(1,deployProgress-delta));updateExplosion();}}
    function onScrollDrag(e){if(!isScrollDrag||!hoveredComp)return;const state=compStates.get(hoveredComp.userData.id);if(!state)return;if(activeScroll==='v'){const dy=e.clientY-scrollStartY;state.rotY=(state.rotY||0)-dy*0.02;hoveredComp.rotation.y=state.rotY;scrollStartY=e.clientY;thumbV.style.top=(32+Math.sin(state.rotY)*22)+'px';}else if(activeScroll==='h'){const dx=e.clientX-scrollStartX;state.rotX=(state.rotX||0)-dx*0.02;hoveredComp.rotation.x=state.rotX;scrollStartX=e.clientX;thumbH.style.left=(32+Math.sin(state.rotX)*22)+'px';}}
    function updateExplosion(){componentMeshes.forEach(c=>{if(c.userData.origPos){const o=c.userData.origPos,d=c.userData.explodeDir,dist=c.userData.explodeDist;c.position.x=o.x+d.x*dist*deployProgress;c.position.y=o.y+d.y*dist*deployProgress;c.position.z=o.z+d.z*dist*deployProgress;c.userData.isConnected=deployProgress<0.1;}});footprintMeshes.forEach(f=>{f.visible=deployProgress>0.3;});document.getElementById('deployPct').textContent=Math.round(deployProgress*100)+'%';updateStats();}
    function resetAll(){deployProgress=0;componentMeshes.forEach(c=>{if(c.userData.origPos){c.position.copy(c.userData.origPos);c.rotation.set(0,0,0);c.scale.set(1,1,1);c.userData.isConnected=true;}const state=compStates.get(c.userData.id);if(state){state.rotX=0;state.rotY=0;state.cScale=1;}});footprintMeshes.forEach(f=>{f.userData.occupied=true;f.visible=false;});document.getElementById('deployPct').textContent='0%';updateStats();}
    function showScrollbars(c){if(!c)return;if(hideTimer){clearTimeout(hideTimer);hideTimer=null;}const pos=getScreenPos(c);if(!pos)return;scrollV.style.left=(pos.x+45)+'px';scrollV.style.top=(pos.y-45)+'px';scrollH.style.left=(pos.x-45)+'px';scrollH.style.top=(pos.y+45)+'px';floatName.textContent=c.userData.name||c.userData.id;floatType.textContent=c.userData.type||'';floatInfo.style.left=(pos.x-70)+'px';floatInfo.style.top=(pos.y-70)+'px';floatInfo.classList.add('visible');scrollbars.classList.add('visible');}
    function updateScrollPos(c){if(!c||!scrollbars.classList.contains('visible'))return;const pos=getScreenPos(c);if(!pos)return;scrollV.style.left=(pos.x+45)+'px';scrollV.style.top=(pos.y-45)+'px';scrollH.style.left=(pos.x-45)+'px';scrollH.style.top=(pos.y+45)+'px';floatInfo.style.left=(pos.x-70)+'px';floatInfo.style.top=(pos.y-70)+'px';}
    function hideScrollbars(imm=false){if(scrollLocked||isScrollDrag)return;if(imm){if(hideTimer)clearTimeout(hideTimer);hoveredComp=null;scrollbars.classList.remove('visible');floatInfo.classList.remove('visible');}else{if(hideTimer)clearTimeout(hideTimer);hideTimer=setTimeout(()=>{if(!scrollLocked&&!isScrollDrag){hoveredComp=null;scrollbars.classList.remove('visible');floatInfo.classList.remove('visible');}},150);}}
    function getScreenPos(obj){const v=new THREE.Vector3();new THREE.Box3().setFromObject(obj).getCenter(v);v.project(camera);return{x:(v.x*0.5+0.5)*window.innerWidth,y:(-v.y*0.5+0.5)*window.innerHeight};}
    function updateStats(){let conn=0;componentMeshes.forEach(c=>{if(c.userData.isConnected)conn++;});document.getElementById('compCount').textContent=COMPONENTS.length;document.getElementById('connCount').textContent=conn;}
    function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);}
    window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
    init();
    </script>
